<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영화 찜 목록</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>영화 찜 목록</h1>
    <input id="query" type="search" placeholder="영화 제목을 검색하세요">
  </header>
  <main>
    <section>
      <h2>검색 결과</h2>
      <div id="results" class="grid"></div>
    </section>
    <section>
      <h2>내가 찜한 영화</h2>
      <div id="wishlist" class="grid"></div>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
